services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: coder
      POSTGRES_PASSWORD: change-me-local-only
      POSTGRES_DB: coder
    volumes:
      - coder-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coder -d coder"]
      interval: 5s
      timeout: 5s
      retries: 20
  coder:
    image: ghcr.io/coder/coder:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CODER_ACCESS_URL: ${CODER_ACCESS_URL:-http://localhost:7080}
      CODER_PG_CONNECTION_URL: postgresql://coder:change-me-local-only@postgres:5432/coder?sslmode=disable
      CODER_HTTP_ADDRESS: 0.0.0.0:7080
    ports:
      - "7080:7080"
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    depends_on:
      - coder
    environment:
      PORT: 3000
      CODER_ACCESS_URL: http://coder:7080
      CODER_SESSION_TOKEN: ${CODER_SESSION_TOKEN:?Set CODER_SESSION_TOKEN}
      FRANKENSTEIN_API_SECRET: ${FRANKENSTEIN_API_SECRET:?Set FRANKENSTEIN_API_SECRET}
    ports:
      - "3000:3000"
volumes:
  coder-postgres:
