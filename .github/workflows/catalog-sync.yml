name: Catalog validation
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'catalog/**'
      - 'vendor/**'
      - 'scripts/**'
      - 'services/**'
      - 'tests/**'
      - 'render.yaml'
      - 'docker-compose.yml'
      - '.github/workflows/catalog-sync.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y rsync
      - name: Materialize the catalog
        run: bash scripts/import-catalog.sh
      - name: Fail if the catalog is not reproducible
        run: git diff --exit-code -- catalog/index.json catalog/templates catalog/modules
      - name: Validate the catalog index
        run: bash scripts/validate-catalog.sh
      - name: Syntax-check shell scripts
        run: for script in scripts/*.sh; do bash -n "$script"; done
      - name: Lint YAML
        run: |
          python3 -m pip install --quiet pyyaml
          python3 -c "import yaml; yaml.safe_load(open('render.yaml')); yaml.safe_load(open('docker-compose.yml'))"
      - name: Run tests
        run: node --test "tests/*.test.mjs"
