name: Catalog validation
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'catalog/**'
      - 'vendor/**'
      - 'scripts/**'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y rsync
      - run: bash scripts/import-catalog.sh
      - run: git diff --exit-code -- catalog/index.json catalog/templates catalog/modules
